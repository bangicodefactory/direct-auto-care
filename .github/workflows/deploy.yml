name: Deploy (per-client)

# White-label deploy to Namecheap cPanel over SSH. One GitHub Environment per
# client holds that client's own secrets/vars, so the SAME build ships to any
# client with its own domain, database, .env (COMPANY_* + THEME_*), and branding.
#
# Runs automatically after CI succeeds on `main` (deploys every client listed in
# the DEPLOY_CLIENTS repo variable), and can be run manually for one client.
# GATED by the repo variable DEPLOY_ENABLED — nothing deploys until it is "true".
#
# Per-CLIENT GitHub Environment (Settings → Environments → e.g. "directautocare"):
#   Secrets: CPANEL_SSH_HOST, CPANEL_SSH_PORT, CPANEL_SSH_USER, CPANEL_SSH_KEY,
#            CPANEL_DEPLOY_PATH, CPANEL_ENV (that client's full server .env)
#   Vars:    CPANEL_PHP_BIN (optional), SENTRY_ORG/SENTRY_PROJECT (optional,
#            override the repo-level defaults for a per-client Sentry project)
# Repo-level:
#   Vars:    DEPLOY_ENABLED ("true"), DEPLOY_CLIENTS (JSON array of environment
#            names, e.g. ["garage-demo","directautocare"])
# See deploy/README.md for the full "add a new client" runbook.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      client:
        description: 'Which client to deploy (must match a GitHub Environment name; "all" = every client in DEPLOY_CLIENTS)'
        type: string
        default: all
      seed:
        description: 'DB seeding: none (additive migrate) · prod (real client first deploy — roles+admin, no demo) · demo (garage showcase reset — DROPS all tables)'
        type: choice
        options:
          - none
          - prod
          - demo
        default: none

# No write scopes needed — this only reads the repo and pushes over SSH.
permissions:
  contents: read

jobs:
  # Resolve which client environments to deploy into a matrix.
  prepare:
    name: Resolve target clients
    runs-on: ubuntu-latest
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    outputs:
      clients: ${{ steps.pick.outputs.clients }}
    steps:
      - id: pick
        env:
          # A single manual client, or "all"/auto → the DEPLOY_CLIENTS repo var.
          INPUT_CLIENT: ${{ github.event.inputs.client }}
          ALL_CLIENTS: ${{ vars.DEPLOY_CLIENTS }}
        run: |
          if [ -n "$INPUT_CLIENT" ] && [ "$INPUT_CLIENT" != "all" ]; then
            printf 'clients=["%s"]\n' "$INPUT_CLIENT" >> "$GITHUB_OUTPUT"
          else
            printf 'clients=%s\n' "${ALL_CLIENTS:-[]}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build & deploy → ${{ matrix.client }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ matrix.client }}
    strategy:
      # Deploy clients independently; one failure must not cancel the others.
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.prepare.outputs.clients) }}
    concurrency:
      group: deploy-${{ matrix.client }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # On a workflow_run trigger, deploy the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ---- Guard: the client's Environment MUST supply its own SSH target ----
      # GitHub silently falls back to repo-level secrets for any key an
      # Environment doesn't define. Without this, a client whose Environment is
      # missing a CPANEL_* secret would inherit ANOTHER client's server/path and
      # write its .env onto the wrong instance. Fail fast instead.
      - name: Assert environment secrets are set
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
          CPANEL_ENV: ${{ secrets.CPANEL_ENV }}
        run: |
          missing=
          for name in CPANEL_SSH_HOST CPANEL_SSH_PORT CPANEL_SSH_USER CPANEL_SSH_KEY CPANEL_DEPLOY_PATH CPANEL_ENV; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Environment '${{ matrix.client }}' is missing secret(s):$missing — refusing to fall back to repo-level secrets."
            exit 1
          fi

      # ---- Build the front-end (shared hosting has no Node) ----
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # .npmrc disables postinstall scripts, so @sentry/cli never fetched its
      # binary. Source-map upload (below) needs it — fetch it explicitly here.
      # Harmless no-op for the build when SENTRY_AUTH_TOKEN isn't configured yet.
      - name: Fetch sentry-cli binary
        run: node ./node_modules/@sentry/cli/scripts/install.js
      # VITE_* are baked into the bundle; SENTRY_AUTH_TOKEN/ORG/PROJECT drive the
      # source-map upload. With no token the Vite plugin is skipped (see vite.config.js).
      # The theme is NOT baked in — it is injected per client at runtime via
      # /branding.css — so the same bundle themes itself for every client.
      - name: Build front-end (+ upload source maps)
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: '0.1'
          # Front-end Sentry environment = the client slug. For front/back events to
          # GROUP, the client's CPANEL_ENV must set SENTRY_ENVIRONMENT to the SAME
          # value (the .env template does — see deploy/README.md). Override per
          # client with the env-level SENTRY_ENVIRONMENT var if you must.
          VITE_SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT || matrix.client }}
          VITE_SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
          SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npm run build

      # ---- Production PHP deps (no dev tooling — no Boost/PHPUnit on the host) ----
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --optimize-autoloader --no-interaction

      # ---- SSH ----
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ---- Upload (rsync). Excludes protect the server's .env and storage/. ----
      # No --delete: avoids ever removing server-side runtime files. Re-enable
      # later (carefully) once the pipeline is proven if you want a pristine sync.
      - name: Deploy with rsync
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          rsync -rlzv --no-perms --no-owner --no-group --omit-dir-times \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            --exclude-from=deploy/garage/rsync-exclude.txt \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      # ---- Write the server .env from this client's CPANEL_ENV secret ----
      - name: Write server .env
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
          ENV_CONTENT: ${{ secrets.CPANEL_ENV }}
        run: |
          printf '%s' "$ENV_CONTENT" | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077 && cat > '$DEPLOY_PATH/.env'"

      # ---- Migrate + cache, on the server ----
      # The "seed" input drives post-deploy.sh: none=additive migrate,
      # prod=roles+admin (real client first deploy), demo=migrate:fresh --seed
      # (garage showcase reset). Auto-deploys (workflow_run) always use none.
      - name: Post-deploy (migrate + cache)
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
          PHP_BIN: ${{ vars.CPANEL_PHP_BIN }}
          CLIENT: ${{ matrix.client }}
          SEED: ${{ (github.event_name == 'workflow_dispatch' && inputs.seed) || 'none' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && PHP_BIN='${PHP_BIN:-php}' SEED='${SEED:-none}' CLIENT='${CLIENT}' bash deploy/garage/post-deploy.sh"
